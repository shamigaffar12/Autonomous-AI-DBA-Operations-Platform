<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Autonomous AI DBA Operations Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { min-height: 100vh; margin: 0; background: linear-gradient(135deg, #0d1b2a, #1b263b); font-family: "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 450px; background: #fff; border-radius: 18px; padding: 32px; box-shadow: 0 20px 45px rgba(0,0,0,.25); }
        .brand-icon { width: 58px; height: 58px; border-radius: 16px; background: #0d1b2a; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 16px auto; }
        .login-title { text-align: center; font-weight: 800; color: #0d1b2a; margin-bottom: 6px; }
        .login-subtitle { text-align: center; color: #6c757d; font-size: 14px; margin-bottom: 24px; }
        .btn-login { background: #0d1b2a; border: none; font-weight: 700; padding: 11px; }
        .btn-login:hover { background: #1b263b; }
        .demo-box { margin-top: 18px; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px; font-size: 13px; color: #475569; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-icon"><i class="bi bi-shield-lock"></i></div>
        <h3 class="login-title">AI DBA Platform</h3>
        <div class="login-subtitle">Secure access for DBA operations and governance</div>
        {% if error_message %}<div class="alert alert-danger">{{ error_message }}</div>{% endif %}
        <form method="post" action="/auth/login">
            <div class="mb-3"><label class="form-label fw-semibold">Username</label><input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus></div>
            <div class="mb-3"><label class="form-label fw-semibold">Password</label><input type="password" name="password" class="form-control" placeholder="Enter password" required></div>
            <button type="submit" class="btn btn-primary btn-login w-100"><i class="bi bi-box-arrow-in-right"></i> Login</button>
        </form>
        <div class="demo-box">
            <strong>Demo Users</strong>
            <div class="mt-2">Admin: <code>admin</code> / <code>admin@123</code></div>
            <div>DBA: <code>dba</code> / <code>dba@123</code></div>
            <div>Lead DBA: <code>lead_dba</code> / <code>lead@123</code></div>
            <div>DBA Manager: <code>manager</code> / <code>manager@123</code></div>
            <div>Viewer: <code>viewer</code> / <code>viewer@123</code></div>
        </div>
    </div>
</body>
</html>

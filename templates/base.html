<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>

        Autonomous AI DBA Operations Platform

    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {

            margin: 0;

            background-color: #f4f6f9;

            overflow-x: hidden;

        }

        .sidebar {

            position: fixed;

            top: 0;

            left: 0;

            height: 100vh;

            width: 250px;

            background-color: #0d1b2a;

            color: white;

            padding-top: 20px;

            z-index: 1000;

        }

        .sidebar-title {

            font-size: 22px;

            font-weight: bold;

            text-align: center;

            padding: 15px;

            border-bottom: 1px solid #243447;

        }

        .sidebar a {

            display: block;

            color: #dce3ea;

            text-decoration: none;

            padding: 14px 25px;

            transition: 0.3s;

        }

        .sidebar a:hover {

            background-color: #1b263b;

            color: white;

        }

        .main-content {

            margin-left: 250px;

            min-height: 100vh;

        }

        .top-header {

            background-color: white;

            padding: 15px 25px;

            border-bottom: 1px solid #dee2e6;

        }

        .page-content {

            padding: 25px;

        }

        .card {

            border: none;

            border-radius: 12px;

        }

    </style>

</head>

<body>

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="sidebar-title">

            AI DBA Platform

        </div>

        <a href="/dashboard">

            Dashboard

        </a>

        <a href="/analytics">

            Analytics

        </a>

        <a href="/incidents">

            Incidents

        </a>

        <a href="/approvals">

            Governance

        </a>

    </div>

    <!-- MAIN CONTENT -->

    <div class="main-content">

        <div class="top-header">

            <div
                class="d-flex justify-content-between align-items-center"
            >

                <div>

                    <strong>

                        Autonomous AI DBA Operations Platform

                    </strong>

                </div>

                <div>

                    <span
                        class="badge bg-success"
                    >

                        Platform Online

                    </span>

                </div>

            </div>

        </div>

        <div class="page-content">

            {% block content %}

            {% endblock %}

        </div>

    </div>

</body>

</html>
